name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk ClarinhaEAmigas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClarinhaEAmigas
          path: ClarinhaEAmigas.apk

      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" ClarinhaEAmigas.apk --title "Clarinha e Amigas $TAG" --notes "APK para Android (tablet e celular)."
